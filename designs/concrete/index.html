<body>
<a class="skip" href="#content">skip the walk</a>
<header class="hud" id="hud">
  <a class="brand" href="#top" data-name aria-label="back to the entrance"></a>
  <p class="hud-where" aria-live="off"><span class="lvl" id="where">entrance</span></p>
  <div class="hud-r">
    <button class="switch" type="button" data-kit="theme" aria-label="switch between day and night"><span class="sw-t"><span>day</span><span>night</span></span><span class="sw-k" aria-hidden="true"></span></button>

  </div>
  <i class="hud-prog" aria-hidden="true"><b id="prog"></b></i>
</header>
<main id="top">
  <section class="walk" id="walk" aria-label="the building: a walk through five rooms of concrete and light">
    <div class="stage" id="stage">
      <div class="still" id="still" aria-hidden="true"></div>
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="hero" id="hero"></div>
      <div class="room" data-room="1" aria-hidden="true"></div>
      <div class="room" data-room="2" aria-hidden="true"></div>
      <div class="room" data-room="3" aria-hidden="true"></div>
      <div class="room" data-room="4" aria-hidden="true"></div>
      <nav class="plan" id="plan" aria-label="rooms"></nav>
      <p class="cue" id="cue" aria-hidden="true"><i></i><span>scroll to walk in</span></p>
      <div class="whiteout" id="whiteout" aria-hidden="true"></div>
    </div>
  </section>
  <div class="content" id="content" tabindex="-1">
    <i class="page-top" id="page-top" aria-hidden="true"></i>
    <section class="level" id="work" aria-labelledby="work-h">
      <header class="slab"><p class="lvl"><span>level 01</span><span class="lvl-n">experience, professional development</span></p><h2 class="cast" id="work-h">work</h2></header>
      <div class="wrap" id="work-in"></div>
    </section>
    <section class="level" id="made" aria-labelledby="made-h">
      <header class="slab"><p class="lvl"><span>level 02</span><span class="lvl-n">hackathons, side projects, skills</span></p><h2 class="cast" id="made-h">projects</h2></header>
      <div class="wrap" id="made-in"></div>
    </section>
    <section class="level" id="study" aria-labelledby="study-h">
      <header class="slab"><p class="lvl"><span>level 03</span><span class="lvl-n">schools, research, coursework</span></p><h2 class="cast" id="study-h">education</h2></header>
      <div class="wrap" id="study-in"></div>
    </section>
    <section class="level" id="log" aria-labelledby="log-h">
      <header class="slab"><p class="lvl"><span>level 04</span><span class="lvl-n">the numbers</span></p><h2 class="cast" id="log-h">site log</h2></header>
      <div class="wrap" id="log-in"></div>
    </section>
    <section class="level" id="hmu" aria-labelledby="hmu-h">
      <header class="slab"><p class="lvl"><span>level 05</span><span class="lvl-n">contact</span></p><h2 class="cast" id="hmu-h">hmu</h2></header>
      <div class="wrap" id="hmu-in"></div>
    </section>
  </div>
</main>
<footer class="foot">
  <div class="wrap foot-in"><div id="foot-in"></div><button class="switch" type="button" data-kit="theme" aria-label="switch between day and night"><span class="sw-t"><span>day</span><span>night</span></span><span class="sw-k" aria-hidden="true"></span></button></div>
