<body>
<a class="skip" href="#work">skip to the work</a>

<div class="stage" id="stage" aria-hidden="true">
  <div class="strip"></div>
  <canvas class="fx" width="1" height="1"></canvas>
</div>
<div class="vignette" aria-hidden="true"></div>
<div class="weave" id="weave" aria-hidden="true"></div>

<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="brushy" filterUnits="userSpaceOnUse" x="-20" y="-20" width="460" height="140">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.08" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>
</svg>

<header class="top">
  <a class="mono" id="mono" href="#top"></a>
  <nav class="nav" aria-label="Primary">
    <span id="nav-links"></span>
    <button class="theme" id="theme" type="button" data-kit="theme" aria-label="switch to the nocturne">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>
    </button>
  </nav>
</header>

<main id="main"></main>

<footer class="colophon" id="colophon"></footer>

<nav class="river" id="river-nav" aria-label="Plates along the river">
  <button class="map-btn" id="map-btn" type="button" aria-expanded="false" aria-controls="index" aria-label="the plates along the river"></button>
  <svg id="river" viewBox="-28 0 356 62">
    <path class="bank" d="M6 30 C 36 14, 62 44, 96 32 S 150 12, 186 28 S 250 48, 294 22"/>
    <path class="water" d="M6 30 C 36 14, 62 44, 96 32 S 150 12, 186 28 S 250 48, 294 22"/>
    <g class="stops"></g>
    <g class="boat" aria-hidden="true"><path d="M-7 0 L7 0 L5 3 L-5 3 Z"/><path class="sail" d="M0 -1 L0 -9 L5 -2 Z"/></g>
  </svg>
  <span class="at-plate" id="at-plate" aria-hidden="true"></span>
  <ol class="index" id="index"></ol>
</nav>

<noscript><a href="/llms.txt">Aeden Thomas: plain-text portfolio</a></noscript>
</body>
</html>
