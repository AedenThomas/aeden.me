<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/designs/kit/roulette.js?v=f4ca2388ea"></script><script type="importmap">{"imports":{"/designs/kit/site.js":"/designs/kit/site.js?v=b201e47084","/designs/kit/warm.js":"/designs/kit/warm.js?v=ff51e3c55f"}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Aeden Thomas · Messages</title>
<meta name="description" content="Aeden Thomas, full-stack engineer in London. A portfolio you can text.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" id="theme-color">
<link rel="canonical" href="https://aeden.me/">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="modulepreload" href="/designs/kit/kit.js?v=819df85d77">
<link rel="modulepreload" href="/designs/kit/site.js?v=b201e47084">
<link rel="stylesheet" href="style.css?v=f57ae19b6d">
<script type="module" src="main.js?v=25fb3618e4"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <button type="button" class="back" id="back" aria-controls="side" aria-expanded="false" aria-label="All sections">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg><span class="count" id="unread"></span>
    </button>
    <a class="who" href="#contact" id="who">
      <span class="av-wrap"><img class="av" id="av" alt="" width="40" height="40" decoding="async"><i class="av-dot" id="live-dot" aria-hidden="true"></i></span>
      <span class="who-t">
        <h1 class="name" id="name"></h1>
        <span class="presence" id="status" aria-live="off"><span id="status-t"></span></span>
      </span>
    </a>
    <div class="acts">
      <button type="button" class="icon" id="call-btn" data-kit="call">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.75" y="6.25" width="12.5" height="11.5" rx="3"/><path d="m15.25 10.4 5.1-3.05a.5.5 0 0 1 .75.43v8.44a.5.5 0 0 1-.75.43l-5.1-3.05"/></svg>
      </button>
      <button type="button" class="icon" id="theme-btn" data-kit="theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z"/></svg>
      </button>
    </div>
    <div class="sending" id="sending" aria-hidden="true"><i></i></div>
  </header>

  <nav class="side" id="side" aria-label="Sections">
    <div class="side-head">
      <p class="side-title" aria-hidden="true">Messages</p>
      <button type="button" class="side-close icon" id="side-close" aria-label="Close sections">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 5 5"/></svg>
      <input type="search" id="q" placeholder="Search" aria-label="Search the conversation" autocomplete="off" spellcheck="false">
      <kbd class="kbd" aria-hidden="true">/</kbd>
    </div>
    <ol class="list" id="list"></ol>
    <div class="results" id="results" hidden></div>
    <p class="found sr" id="found" aria-live="polite"></p>
  </nav>

  <main class="thread" id="thread"></main>

  <footer class="foot" id="foot"></footer>
</div>

<form class="composer" id="composer" novalidate>
  <div class="comp-in">
    <p class="asking" id="asking" aria-hidden="true"></p>
    <div class="field" id="field">
      <label class="sr" for="msg" id="msg-label"></label>
      <textarea id="msg" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
      <input id="one" type="text" enterkeyhint="send" hidden>
      <button type="submit" class="send" id="send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5V5.2M5.8 11.1 12 4.9l6.2 6.2"/></svg>
      </button>
    </div>
  </div>
</form>

<noscript><a href="/llms.txt">Aeden Thomas: plain-text portfolio</a></noscript>
</body>
</html>
